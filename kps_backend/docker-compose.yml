version: '3.8'
services:
  backend:
    build: .
    ports:
      - "3000:3000"
    environment:
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: admin1234
      EDITOR_USERNAME: editor
      EDITOR_PASSWORD: editor1234
      SESSION_SECRET: change-this-session-secret
    volumes:
      # เก็บไฟล์ที่อัปโหลดจากแดชบอร์ดไว้ในเครื่อง ไม่หายเมื่อ build/สร้าง container ใหม่
      - ./public/panoramas:/app/public/panoramas
      - ./public/floorplans:/app/public/floorplans
      - ./public/covers:/app/public/covers
      - ./public/tour-images:/app/public/tour-images
    depends_on:
      - db
  db:
    image: mysql:8.0
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: kps_classfinder
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    ports:
      - "8080:80"
    environment:
      PMA_HOST: db
    depends_on:
      - db

volumes:
  db_data: