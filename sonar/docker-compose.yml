# SonarQube สำหรับตรวจคุณภาพโค้ด — แยกจาก kps_backend/docker-compose.yml ทั้งหมด (คนละฐานข้อมูล คนละ container)
#
#   เปิด:  docker compose -f sonar/docker-compose.yml up -d     แล้วเปิด http://localhost:9000
#   ปิด:   docker compose -f sonar/docker-compose.yml stop
#
# ใช้ RAM ประมาณ 2–3 GB ตอนเปิด ตรวจเสร็จแล้วปิดได้ ผลตรวจยังอยู่ (เก็บใน volume)
#
# ตั้ง `name:` และชื่อ volume ไว้ชัดเจน (kps_...) เพราะถ้าเครื่องนี้มีอีกโปรเจกต์ที่ใช้โฟลเดอร์ย่อยชื่อ "sonar/"
# เหมือนกัน (เช่น พื้นฐานจากเทมเพลตเดียวกัน) Docker Compose จะตั้งชื่อโปรเจกต์ตามชื่อโฟลเดอร์ปัจจุบันเป็นค่าเริ่มต้น
# ("sonar" ทั้งคู่) แล้วชน volume กันโดยไม่รู้ตัว (ข้อมูลตรวจของสองโปรเจกต์ปนกันอยู่ใน SonarQube ตัวเดียว)
name: kps-sonar
services:
  sonarqube:
    image: sonarqube:community
    container_name: kps_sonarqube
    depends_on:
      sonar_db:
        condition: service_healthy
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonar_db:5432/sonar
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: ${SONAR_DB_PASSWORD:-sonar_local_only}
      # Docker Desktop บน Windows ตั้ง vm.max_map_count ไม่ได้ -> ปิดการใช้ mmap ของ Elasticsearch แทน
      SONAR_SEARCH_JAVAADDITIONALOPTS: "-Dnode.store.allow_mmap=false"
    ports:
      - "9000:9000"
    volumes:
      - sonar_data:/opt/sonarqube/data
      - sonar_extensions:/opt/sonarqube/extensions
      - sonar_logs:/opt/sonarqube/logs

  # ฐานข้อมูลของ SonarQube เอง (ไม่ใช่ฐานข้อมูล kps_classfinder ของแอป)
  sonar_db:
    image: postgres:16-alpine
    container_name: kps_sonar_db
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: ${SONAR_DB_PASSWORD:-sonar_local_only}
      POSTGRES_DB: sonar
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sonar"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - sonar_db_data:/var/lib/postgresql/data

volumes:
  sonar_data:
    name: kps_sonar_data
  sonar_extensions:
    name: kps_sonar_extensions
  sonar_logs:
    name: kps_sonar_logs
  sonar_db_data:
    name: kps_sonar_db_data
