# ตั้งค่าการตรวจคุณภาพโค้ดด้วย SonarQube (วิธีใช้ดู sonar/README.md)
sonar.projectKey=kps-classfinder
sonar.projectName=KPS ClassFinder
sonar.projectVersion=1.0
sonar.sourceEncoding=UTF-8

# โค้ดที่ตรวจ: backend (Node.js / Express) + แดชบอร์ด admin (vanilla JS ฝังใน index.html + /tour/*.js)
# แอปมือถือ (Flutter/Dart) ยังไม่ได้ตรวจ — SonarQube Community Edition ไม่รองรับภาษา Dart
sonar.sources=kps_backend/server.js,kps_backend/lib,kps_backend/public
sonar.tests=kps_backend/test
sonar.test.inclusions=kps_backend/test/**/*.test.js

# ไม่ต้องตรวจ: ไลบรารี ไฟล์ที่ผู้ใช้อัปโหลดผ่านแดชบอร์ด (ผังชั้น/รูปปก/ภาพ 360°) และไฟล์รูปทั่วไป
sonar.exclusions=**/node_modules/**,**/public/panoramas/**,**/public/covers/**,**/public/tour-images/**,\
**/public/floorplans/floorplan_*,**/*.png,**/*.jpg,**/*.jpeg,**/*.webp

# coverage: รัน `npm test` ใน kps_backend ก่อน (Jest สร้าง coverage/lcov.info) แล้วค่อยรัน python sonar/sonar_scan.py
# วัดเฉพาะโค้ดฝั่ง backend — หน้าแดชบอร์ด (public/**) เป็นโค้ดวาดหน้าจอ ยังไม่มีชุดทดสอบอัตโนมัติจึงไม่นับเข้า coverage
sonar.javascript.lcov.reportPaths=kps_backend/coverage/lcov.info
sonar.coverage.exclusions=kps_backend/public/**

# token / ที่อยู่ server ไม่เขียนไว้ที่นี่ (ไฟล์นี้ขึ้น GitHub) — ส่งผ่านตัวแปร SONAR_TOKEN / SONAR_HOST_URL ตอนรัน

# ---------------------------------------------------------------------------
# ข้ามการเตือนที่ตรวจแล้วว่าไม่ใช่ปัญหาจริง (ข้ามเฉพาะกฎ + ไฟล์ที่ระบุ ไม่ปิดกฎทั้งโปรเจกต์)
sonar.issue.ignore.multicriteria=fakePassword,tourComment,groupRole,pinClick,pinClickKeyboard,tourZoom,tourDialog

# 1) ชื่อคีย์ "change_password" ในตาราง label ของหน้า log เป็นแค่ชื่อประเภทเหตุการณ์ (เช่นเดียวกับ login/logout)
#    ค่าที่ผูกไว้เป็นข้อความภาษาไทยสำหรับแสดงผล ไม่ใช่รหัสผ่านจริง — ไม่มีความลับอะไรอยู่ในโค้ดบรรทัดนี้
sonar.issue.ignore.multicriteria.fakePassword.ruleKey=javascript:S2068
sonar.issue.ignore.multicriteria.fakePassword.resourceKey=kps_backend/public/index.html

# 2) เมนู Virtual Tour คอมเมนต์ไว้ตั้งใจ (ซ่อนฟีเจอร์ที่ยังไม่พร้อมเปิดใช้ แต่โค้ดหลังบ้านทำไว้ครบแล้ว)
#    เพื่อเปิดกลับมาได้ทันทีด้วยการลบคอมเมนต์ ไม่ใช่โค้ดเก่าที่ลืมลบ — ดูคอมเมนต์อธิบายในไฟล์เอง
sonar.issue.ignore.multicriteria.tourComment.ruleKey=Web:AvoidCommentedOutCodeCheck
sonar.issue.ignore.multicriteria.tourComment.resourceKey=kps_backend/public/index.html

# 3) role="group" บน <div class="btn-group"> เป็นรูปแบบที่ Bootstrap แนะนำเองสำหรับกลุ่มปุ่ม radio-toggle
#    (เช่นในตัวอย่างทางการของ Bootstrap) เปลี่ยนเป็น <fieldset> จะไม่ตรงกับสไตล์ปุ่มที่ตั้งใจออกแบบไว้
sonar.issue.ignore.multicriteria.groupRole.ruleKey=Web:S6819
sonar.issue.ignore.multicriteria.groupRole.resourceKey=kps_backend/public/index.html

# 4) ภาพผังชั้น/ภาพ 360° ที่คลิกเพื่อ "ปักหมุดตรงตำแหน่งที่คลิก" เป็นเครื่องมือของผู้ดูแลระบบ (ไม่ใช่ผู้ใช้ทั่วไป)
#    เป็นการระบุพิกัดพิกเซลที่แม่นยำ ซึ่งโดยธรรมชาติต้องใช้เมาส์/นิ้วสัมผัส ยังไม่มีทางเลือกคีย์บอร์ดที่ใช้งานได้จริง
#    (ทำเพิ่มได้ภายหลัง เช่น ปุ่มลูกศรขยับหมุดทีละพิกเซล แต่ยังไม่ได้ทำตอนนี้)
sonar.issue.ignore.multicriteria.pinClick.ruleKey=Web:S6847
sonar.issue.ignore.multicriteria.pinClick.resourceKey=kps_backend/public/index.html
sonar.issue.ignore.multicriteria.pinClickKeyboard.ruleKey=Web:MouseEventWithoutKeyboardEquivalentCheck
sonar.issue.ignore.multicriteria.pinClickKeyboard.resourceKey=kps_backend/public/index.html

# 5) ปิดซูมหน้าเว็บด้วย user-scalable=no ในหน้าเดินชม 360° ตั้งใจ เพราะการบีบนิ้วใช้หมุน/ซูมภาพพาโนรามาเอง
#    ถ้าเปิดซูมหน้าเว็บด้วย จะชนกับท่าทางบีบนิ้วของตัวดูภาพ ใช้งานลำบากกว่าเดิม
sonar.issue.ignore.multicriteria.tourZoom.ruleKey=Web:S7926
sonar.issue.ignore.multicriteria.tourZoom.resourceKey=kps_backend/public/tour/index.html

# 6) หน้าเดินชม 360° ใช้ role="dialog" กับแผ่นรายการจุด (bottom sheet) ที่เปิด/ปิดด้วย JS และจัดตำแหน่งเอง
#    ยังไม่ได้เปลี่ยนเป็น <dialog> เพราะอาจกระทบการซ้อนชั้น/โฟกัสของ Photo Sphere Viewer (ถ้าจะแก้ ต้องทดสอบบนมือถือจริง)
sonar.issue.ignore.multicriteria.tourDialog.ruleKey=Web:S6819
sonar.issue.ignore.multicriteria.tourDialog.resourceKey=kps_backend/public/tour/index.html
